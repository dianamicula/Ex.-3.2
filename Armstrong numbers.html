<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JavaScript current day and time</title>
	<h1>
	 program to find Armstrong number between intervals
	</h1>
	</head>
<body>

<script type="text/javascript">
//take an input 
const lowNumber= parseInt(prompt('Enter a pozitive low integer value: '));
const highNumber= parseInt(prompt('Enter a pozitive high integer value: '));

	

console.log('Armstrong Numbers: ');
  
//looping through lowNumber to highNumber 
for (let i=lowNumber; i<=highNumber; i++) {

// converting number to string
let numberOfDigits=i.toString().length;

let sum=0;

//create a temporary variable
let temp= i;

/*loop through a number to find if
a number is an Armstrong number*/
while(temp>0) {

let remainder=temp%10;
sum +=remainder ** numberOfDigits;
//removing last digit from the number 
temp=parseInt(temp/10);//convert float into integer
}

if (sum==i){
console.log(i);
}
}
</script>
</body>
</html>
